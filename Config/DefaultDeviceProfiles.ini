; Phone device profiles for Movecade Kart (owner: mobile performance). PC is unaffected: none of these profiles is
; ever selected on Windows (the Windows profiles come from the engine and the game's own presets,
; Render/KartGameUserSettings).
;
; Target: a steady 60 fps on an iPhone 13 class phone (A15, 4 GB) and its Android equivalent (Snapdragon 8 Gen 1 /
; Adreno 730 class), with a thermal fallback to an evenly paced 30 (UKartRenderQualitySubsystem, kart.Render.*).
;
; Buckets (mobile renderer, ES3.1 / Metal, no Lumen, no Nanite: lighting is the venues' sky light + directional
; light, with the mobile fallbacks applied by UKartMobileLighting):
;   Low  : 30 fps, 1.5x content scale, one short 512 cascade, no AA, drivers at LOD2, half particle and grass density.
;   Mid  : 60 fps, 1.75x, one 1024 cascade, FXAA, drivers at LOD2, 0.75 density.
;   High : 60 fps, 2x (1688x780 on iPhone 13), one 2048 cascade, TAA, drivers at LOD1, full content. The iPhone 13
;          bucket.
;   Epic : 60 fps (120 with kart.Render.MobileFrameCap=0), 2x, two 2048 cascades, TAA, full bloom.
;
; Every bucket sets its r.* values explicitly, not only through sg.* groups: the groups resolve through each
; platform's own Scalability ini (IOSScalability.ini on the phone, BaseScalability on PC), so explicit values make
; the -featureleveles31 -DP=IOS_High preview on PC match the phone (Tools/ue/mobile_audit.ps1).
;
; Change log: 2026-10-26 first pass from the PC mobile-preview audit (Saved/MobileAudit). Device numbers from the
; Mac session should retune the content scale and the cascades first.

; ----------------------------------------------------------------------------------------------------------------
; iOS
; ----------------------------------------------------------------------------------------------------------------

[IOS DeviceProfile]
; Shared by every iOS bucket.
; The drivers' LOD0 (~275k vertices, 13 face morphs) is desktop-only: morph targets run on the CPU on the mobile
; renderer. Phones draw the generated LOD1/LOD2 (Tools/ue/make_avatar_lods.py); Low and Mid raise this to 2.
+CVars=r.SkeletalMeshLODBias=1
; The mobile path holds a fixed resolution per bucket (r.MobileContentScaleFactor); the frame-time guard lowers
; features instead (KartRender::MobileBudgetFor).
+CVars=r.DynamicRes.OperationMode=0
; Kart and venue lighting fallback on the mobile renderer (UKartMobileLighting): sky lights captured once, extra
; directional lights folded into the sky light, local light shadows off.
+CVars=kart.MobileLighting=1
; Particles: Niagara's distance culling on; the buckets set kart.FX.SpawnScale (UKartFxSubsystem's burst counts and
; stream rates) and fx.NiagaraGlobalSystemCountScale.
+CVars=fx.Niagara.Scalability.DistanceCulling=1
; Post: no motion blur, light shafts, lens flares or chromatic fringe on phones (all near-invisible at this size).
+CVars=r.MotionBlurQuality=0
+CVars=r.LightShaftQuality=0
+CVars=r.LensFlareQuality=0
+CVars=r.SceneColorFringeQuality=0
+CVars=r.DepthOfFieldQuality=0
; Sky light: capture once, never per frame (the venues' realtime captures are switched off by UKartMobileLighting).
+CVars=r.SkyLight.RealTimeReflectionCapture=0
; Streaming: keep the pool in budget on 4 GB phones (iOS kills apps around 2-2.5 GB resident on a 4 GB device).
+CVars=r.Streaming.LimitPoolSizeToVRAM=0
+CVars=r.Streaming.UseFixedPoolSize=1

